<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Huvath Fuel Sales</title>
<meta name="theme-color" content="#0b6e63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: app shell — sticky top bar, single working column, bottom tab bar on phones / left rail on wide screens */
:root{
  --bg:#eef2f0; --surface:#ffffff; --surface-2:#f6f8f7; --ink:#15211e; --muted:#5a6b66; --line:#d6dfdb;
  --accent:#0b6e63; --accent-ink:#ffffff; --accent-soft:#dcefeb;
  --petrol:#c46a05; --petrol-soft:#fbecd8; --diesel:#2d5b8c; --diesel-soft:#dde8f4;
  --good:#1d7a48; --good-soft:#ddf1e6; --warn:#9a6a10; --warn-soft:#f8ecd1; --bad:#b83226; --bad-soft:#f8dfdc;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1614; --surface:#16211f; --surface-2:#1b2826; --ink:#e4ece9; --muted:#93a59f; --line:#2b3a37;
  --accent:#3db3a2; --accent-ink:#06201c; --accent-soft:#173a35;
  --petrol:#f0a443; --petrol-soft:#3a2a14; --diesel:#80aee0; --diesel-soft:#1c2c3f;
  --good:#52c78d; --good-soft:#163627; --warn:#e3b55a; --warn-soft:#3a2f16; --bad:#f0786a; --bad-soft:#3d1f1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1614; --surface:#16211f; --surface-2:#1b2826; --ink:#e4ece9; --muted:#93a59f; --line:#2b3a37;
  --accent:#3db3a2; --accent-ink:#06201c; --accent-soft:#173a35;
  --petrol:#f0a443; --petrol-soft:#3a2a14; --diesel:#80aee0; --diesel-soft:#1c2c3f;
  --good:#52c78d; --good-soft:#163627; --warn:#e3b55a; --warn-soft:#3a2f16; --bad:#f0786a; --bad-soft:#3d1f1b; color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font-size:1.45rem}
h3{font-size:1.1rem}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand .logo{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand b{font-family:var(--display);font-size:1.3rem;font-weight:700;letter-spacing:.02em;display:block;line-height:1}
.brand small{color:var(--muted);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.datebox{display:flex;align-items:center;gap:6px}
.datebox input{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 8px;font-variant-numeric:tabular-nums}
@media (max-width:520px){.datebox label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.brand small{display:none}.datebox input{padding:5px 6px;font-size:.9rem}}
.who{display:flex;align-items:center;gap:8px;font-size:.85rem}
.who img{width:28px;height:28px;border-radius:50%}
.rolechip{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600}

/* shell */
.shell{display:flex;min-height:calc(100% - 60px)}
.rail{display:none}
main{flex:1;min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 110px;max-width:1080px;margin:0 auto;width:100%}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav{overflow-x:auto;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}
.nav button{flex:1 0 50px;min-width:50px;border:0;background:none;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:.7rem;font-weight:600;cursor:pointer}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent)}
@media (min-width:900px){
  .nav{position:sticky;top:64px;bottom:auto;left:auto;right:auto;flex-direction:column;width:190px;height:calc(100vh - 64px);border-top:0;border-right:1px solid var(--line);padding:12px 8px;gap:2px;background:var(--surface)}
  .nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:10px;font-size:.92rem;padding:10px 12px;border-radius:8px}
  .nav button[aria-current="page"]{background:var(--accent-soft)}
  main{padding-bottom:40px}
}

/* blocks */
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card>h3{margin-bottom:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .l{font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--display);font-size:1.75rem;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .s{font-size:.8rem;color:var(--muted)}
.kpi.petrol{border-top:3px solid var(--petrol)} .kpi.diesel{border-top:3px solid var(--diesel)}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.pagehead p{margin:2px 0 0;color:var(--muted);font-size:.9rem}

/* forms */
label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted);flex:1;min-width:120px}
.in{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:10px 11px;font-size:1rem;color:var(--ink)}
.in:focus{border-color:var(--accent);outline:none;background:var(--surface)}
textarea.in{min-height:70px;resize:vertical}
.big{font-family:var(--mono);font-size:2rem;font-weight:700;padding:12px 14px;text-align:right}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{padding:5px 9px;font-size:.82rem}
.btn.block{width:100%;padding:14px;font-size:1.05rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:9px 8px;border-radius:7px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.fuelpick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fuelpick button{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;text-align:left;cursor:pointer}
.fuelpick button b{display:block;font-family:var(--display);font-size:1.35rem;font-weight:600}
.fuelpick button span{font-size:.85rem;color:var(--muted)}
.fuelpick button[data-fuel="petrol"][aria-pressed="true"]{border-color:var(--petrol);background:var(--petrol-soft)}
.fuelpick button[data-fuel="diesel"][aria-pressed="true"]{border-color:var(--diesel);background:var(--diesel-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:7px 14px;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums}
.chip:hover{border-color:var(--accent)}
.calc{font-family:var(--mono);font-size:1rem;background:var(--surface-2);border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.calc b{font-size:1.25rem}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .main{min-width:0}
.li .main b{font-weight:600}
.li .main div{overflow-wrap:anywhere}
.li .amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.li .acts{grid-column:1/-1;display:flex;gap:6px;justify-content:flex-end}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.dot.petrol{background:var(--petrol)} .dot.diesel{background:var(--diesel)} .dot.coll{background:var(--good)} .dot.other{background:var(--accent)}
.pill{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.petrol{background:var(--petrol-soft);color:var(--petrol)} .pill.diesel{background:var(--diesel-soft);color:var(--diesel)}
.empty{padding:22px 10px;text-align:center;color:var(--muted);font-size:.92rem}
.banner{border-radius:var(--r);padding:12px 14px;font-size:.92rem;border:1px solid var(--line);background:var(--surface-2)}
.banner.warn{background:var(--warn-soft);border-color:transparent;color:var(--ink)}
.banner.bad{background:var(--bad-soft);border-color:transparent}
.banner.good{background:var(--good-soft);border-color:transparent}

/* meter odometer */
.meter{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.meter .in{font-family:var(--mono);font-weight:700;font-size:1.15rem;letter-spacing:.04em;text-align:right;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.meter .in::placeholder{color:var(--muted)}
.mstat{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:.9rem}
.mstat span b{font-family:var(--mono)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--surface-2);font-weight:700;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.sec td{background:var(--accent-soft);color:var(--accent);font-weight:700;letter-spacing:.06em}
tr.sub td{font-weight:600;background:var(--surface-2)}
tr.meterrow td{font-style:italic;color:var(--muted)}
tr.tot td{font-weight:700;border-top:2px solid var(--ink);background:var(--surface-2)}
tr.bad td,td.bad{background:var(--bad-soft);color:var(--bad);font-weight:700;font-style:normal}
.alarm{border-radius:var(--r);padding:12px 14px;background:var(--bad-soft);color:var(--ink);border:2px solid var(--bad);display:flex;flex-direction:column;gap:6px}
.alarm b.t{color:var(--bad);font-family:var(--display);font-size:1.15rem;letter-spacing:.02em}
.rep-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:14px 14px 10px}
.rep-head b{font-family:var(--display);font-size:1.4rem}
.denoms{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.denoms label{display:grid;grid-template-columns:52px 1fr;align-items:center;gap:6px;font-family:var(--mono);font-size:.9rem}

/* overlay */
.ov{position:fixed;inset:0;background:rgba(5,15,13,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:14px 14px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.ov{align-items:center}.sheet{border-radius:14px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.slipimg{width:64px;height:64px;border-radius:8px;object-fit:cover;background:var(--surface-2);border:1px solid var(--line);cursor:pointer}
.checks{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.splash{max-width:520px;margin:12vh auto;text-align:center;padding:0 16px}
.splash h1{font-size:2.2rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tile{text-align:left;cursor:pointer}
.tile:hover{border-color:var(--accent)}
details summary{cursor:pointer;font-weight:600}
.cpick{position:relative}
.cplist{position:absolute;left:0;right:0;top:100%;margin-top:4px;z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:8px;max-height:270px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.cplist button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:11px 12px;cursor:pointer;color:var(--ink)}
.cplist button:first-child{border-top:0}
.cplist button:hover,.cplist button:focus-visible{background:var(--accent-soft)}
.cplist .empty{padding:12px}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.nav button{transition:background .15s,border-color .15s,color .15s}}
</style>
</head>
<body>
<div class="top" id="top">
  <div class="brand">
    <div class="logo" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21V5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v16M3 21h13M7 8h5M15 10h2a2 2 0 0 1 2 2v5a1.5 1.5 0 0 0 3 0V8l-3-3"/></svg></div>

function flatten(docs) {

}
function buildDaily({date, items, day, slips, settings, prevDay, receipts}) {
  settings = settings || DEFAULT_SETTINGS; day = day || {}; slips = slips || []; receipts = (receipts || []).filter(x => !x.deleted);
  const live = items.filter(i => !i.deleted);
  const rows = []; const T = {cash: 0, credit: 0, coll: 0, tcash: 0}; const rec = {petrol: 0, diesel: 0};
  const recAmt = {petrol: 0, diesel: 0}; let transfers = 0;
  const meters = (settings.meters || []).map(m => {
    const dm = (day.meters || {})[m.id] || {}; const pm = prevDay && (prevDay.meters || {})[m.id] || {};
    const start = dm.start ?? pm.end ?? null; const end = dm.end ?? null;
    return {...m, start, end, startFromPrev: dm.start == null && pm.end != null, sale: start != null && end != null ? r3(end - start) : null};
  });
  const meterSale = {petrol: null, diesel: null};
  for (const m of meters) if (m.sale != null) meterSale[m.fuel] = r3((meterSale[m.fuel] || 0) + m.sale);
  for (const f of FUELS) {
    rows.push({kind: "sec", name: FUEL[f].toUpperCase()});
    const cr = live.filter(i => i.t === "credit" && i.fuel === f);
    let q = 0, a = 0;
    for (const i of cr) { rows.push({kind: "item", po: i.po, dno: i.dno, name: i.customer, qty: i.qty, rate: i.rate, credit: i.amount, remark: i.remark}); q += i.qty; a += i.amount; }
    rows.push({kind: "sub", name: "Total credit", qty: r3(q), credit: r2(a)});
    T.credit += a; rec[f] += q; recAmt[f] += a;
    const groups = {};
    for (const i of live.filter(i => i.t === "cash" && i.fuel === f)) {
      const k = i.pay + "|" + i.rate; const g = groups[k] || (groups[k] = {pay: i.pay, rate: i.rate, qty: 0, amt: 0, n: 0});
      g.qty += i.qty; g.amt += i.amount; g.n++;
    }
    const gl = Object.values(groups).sort((x, y) => (x.pay === y.pay ? x.rate - y.rate : x.pay === "cash" ? -1 : 1));
    if (!gl.length) rows.push({kind: "cash", name: "Cash sales", qty: 0, rate: settings.prices[f], cash: 0, tcash: 0});
    for (const g of gl) {
      const isT = g.pay === "transfer";
      rows.push({kind: "cash", name: isT ? "Transfer sales" : "Cash sales", qty: r3(g.qty), rate: g.rate, cash: r2(g.amt), tcash: isT ? null : r2(g.amt), remark: g.n + (g.n === 1 ? " bill" : " bills") + (isT ? " · bank transfer" : "")});
      T.cash += g.amt; if (!isT) T.tcash += g.amt; else transfers += g.amt; rec[f] += g.qty; recAmt[f] += g.amt;
    }
    const ms = meterSale[f]; const diff = ms == null ? null : r3(ms - rec[f]);
    const off = diff != null && Math.abs(diff) > (settings.meterTolerance ?? 0.5);
    rows.push({kind: "meter", bad: off, name: FUEL[f] + " meter total", qty: ms, remark: ms == null ? "Meter reading not entered" : off ? `MISMATCH: recorded ${nL(rec[f])} L, ${diff > 0 ? nL(diff) + " L not recorded" : nL(-diff) + " L over-recorded"}` : `Recorded ${nL(rec[f])} L · matches meter`});
  }
  rows.push({kind: "sec", name: "OTHER COLLECTION"});
  const colls = live.filter(i => i.t === "collect"); const others = live.filter(i => i.t === "other");
  for (const i of colls) {
    const isT = i.pay === "transfer";
    rows.push({kind: "item", name: i.customer, coll: i.amount, tcash: isT ? null : i.amount, remark: [isT ? "Bank transfer" : "", i.ref, i.remark].filter(Boolean).join(" · ")});
    T.coll += i.amount; if (!isT) T.tcash += i.amount; else transfers += i.amount;
  }
  for (const i of others) {
    const isT = i.pay === "transfer";
    rows.push({kind: "item", name: i.desc, tcash: isT ? null : i.amount, remark: "Other income" + (isT ? " · bank transfer" : "")});
    if (!isT) T.tcash += i.amount; else transfers += i.amount;
  }
  if (!colls.length && !others.length) rows.push({kind: "item", name: "—"});
  Object.keys(T).forEach(k => T[k] = r2(T[k]));
  rows.push({kind: "total", name: "TOTAL (MVR)", cash: T.cash, credit: T.credit, coll: T.coll, tcash: T.tcash});

  const tanks = (settings.tanks || []).map(t => {
    const dt = (day.tanks || {})[t.id] || {}; const pt = prevDay && (prevDay.tanks || {})[t.id] || {};
    const recv = receipts.filter(x => x.tankId === t.id); const recvQty = recv.length ? r3(recv.reduce((a, x) => a + num(x.qty), 0)) : null;

    return {...t, sounding: dt.sounding ?? null, bf, loaded, loadedFromReceipts: dt.loaded == null && recvQty != null, cb, usage: bf != null && cb != null ? r3(bf + (loaded || 0) - cb) : null};
  });
  const expenses = Object.entries(day.expenses || {}).filter(([, e]) => e && !e.deleted).map(([id, e]) => ({id, ...e})).sort((a, b) => String(a.at).localeCompare(String(b.at)));
  const expTotal = r2(expenses.reduce((s, e) => s + num(e.amount), 0));
  const okSlips = slips.filter(s => s.status !== "rejected");
  const deposits = r2(okSlips.filter(s => s.kind === "deposit").reduce((s, x) => s + num(x.amount), 0));
  const transferSlips = r2(okSlips.filter(s => s.kind === "transfer").reduce((s, x) => s + num(x.amount), 0));
  const cashCounts = day.cash || {};
  const denoms = DENOMS.map(d => ({d, n: num(cashCounts[d]), v: r2(d * num(cashCounts[d]))}));
  const coins = r2(num(cashCounts.coins));
  const notesTotal = r2(denoms.reduce((s, x) => s + x.v, 0) + coins);
  const cheques = Object.entries(day.cheques || {}).filter(([, c]) => c && !c.deleted).map(([id, c]) => ({id, ...c}));
  const chequeTotal = r2(cheques.reduce((s, c) => s + num(c.amount), 0));
  const counted = r2(notesTotal + chequeTotal);

    const ms = meterSale[f]; const diff = ms == null ? null : r3(ms - rec[f]);
    const tol = settings.meterTolerance ?? 0.5;
    return {fuel: f, start: meters.filter(m => m.fuel === f).map(m => m.start).reduce((a, b) => a == null || b == null ? null : a + b, 0),
      end: meters.filter(m => m.fuel === f).map(m => m.end).reduce((a, b) => a == null || b == null ? null : a + b, 0),
      recorded: r3(rec[f]), meter: ms, diff, value: diff == null ? null : r2(diff * (settings.prices[f] || 0)),
      status: diff == null ? "pending" : Math.abs(diff) <= tol ? "ok" : "off"};
  });
  const meterAlerts = meterCheck.filter(c => c.status === "off").map(c => ({...c, text: c.diff > 0
    ? `${FUEL[c.fuel]} meter shows ${nL(c.meter)} L sold, but the sales sheet has only ${nL(c.recorded)} L. ${nL(c.diff)} L (about MVR ${n2(c.value)}) is missing from the sales sheet.`
    : `${FUEL[c.fuel]}: the sales sheet has ${nL(c.recorded)} L, but the meter shows only ${nL(c.meter)} L sold. ${nL(-c.diff)} L too many recorded. Check for double entries or a wrong meter reading.`}));

    denoms, coins, notesTotal, cheques, chequeTotal, counted, expected, cashDiff: r2(counted - expected), cashCounted: counted > 0,
    slips, notes: day.notes || "", closed: !!day.closed, closedBy: day.closedBy, items: live, count: live.length};
}

    S.settings = s.exists ? {...DEFAULT_SETTINGS, ...s.data()} : null; S.settingsLoaded = true;
    if (!s.exists && S.me.isOwner && !(s.metadata && s.metadata.fromCache)) db.doc("config/settings").set(DEFAULT_SETTINGS).catch(() => {});
    $("#stName").textContent = st().station || "Huvath";
    $("#stAddr").textContent = [st().address1, st().address2].filter(Boolean).join(" · ");
    refreshLive();
  }, onSubErr));
  S.unsubs.push(db.doc("config/customers").onSnapshot(s => {
    S.customers = s.exists ? (s.data().items || {}) : {}; refreshLive(); refreshCustomerSelects();
    // first owner sign-in: load the customers from the original sales sheet
    if (!s.exists && S.me.isOwner && !(s.metadata && s.metadata.fromCache)) {
      const items = {}; DEFAULT_CUSTOMERS.forEach(([name, p, d], i) => items["c" + pad(i + 1)] = {name, petrolRate: p, dieselRate: d, active: true});
      db.doc("config/customers").set({items}).catch(() => {});
    }
  }, onSubErr));
  S.unsubs.push(db.doc("config/roles").onSnapshot(s => {
    S.roles = s.exists ? (s.data().users || {}) : {};
    const prev = S.role; computeRole();
    if (prev === "none" && S.role !== "none") subscribeDate();
    if (prev !== S.role) renderAll(); else refreshLive();
    resolveNames(Object.keys(S.roles));
  }, onSubErr));
  S.unsubs.push(db.collection("staff").onSnapshot(s => {
    S.staff = {}; s.docs.forEach(d => S.staff[d.id] = d.data()); refreshLive(); resolveNames(Object.keys(S.staff));
  }, onSubErr));
}

function subscribeDate() {
  S.dateUnsubs.forEach(u => { try { u(); } catch {} }); S.dateUnsubs = [];
  const db = S.db, D = S.date;
  S.entryDocs = []; S.items = []; S.day = {}; S.dayExists = false; S.slips = []; S.receipts = []; S.prevDay = null;
  S.dateUnsubs.push(db.collection("entries").where("date", "==", D).onSnapshot(s => {
    S.entryDocs = s.docs.map(d => ({...d.data(), _id: d.id})); S.allItems = flatten(S.entryDocs); S.items = S.allItems.filter(i => !i.deleted);
    refreshLive(); resolveNames(S.allItems.map(i => i.by));
  }, onSubErr));

    S.receipts = s.docs.map(d => ({...d.data(), id: d.id})).filter(x => !x.deleted).sort((a, b) => String(a.at).localeCompare(String(b.at))); refreshLive(); syncBinds();

/* entries: one document per person per day (sharded), items merged by id */
async function addItem(item) {
  if (S.writeBlocked) { toast("Your account can't save. Ask the owner for access."); return false; }
  const D = S.date; const id = newId();
  const mine = S.entryDocs.filter(d => d.uid === S.me.id).sort((a, b) => (a.shard || 0) - (b.shard || 0));
  let shard = mine.length ? (mine[mine.length - 1].shard || 0) : 0;
  const last = mine[mine.length - 1];
  if (last && Object.keys(last.items || {}).length >= 700) shard++;
  const docId = `${D}_${S.me.id}_${shard}`; const ref = S.db.doc("entries/" + docId);
  const full = {...item, by: S.me.id, at: new Date().toISOString()};
  /* merge-write: creates the doc if needed; resolves when the server confirms, but the
     local copy updates at once, so the sale shows immediately even when offline */
  ref.update({date: D, uid: S.me.id, shard, items: {[id]: full}}).catch(e => toast(dbErr(e)));
  return true;
}

  S.db.doc("entries/" + it._doc).update({items: {[it.id]: {...patch, editedBy: S.me.id, editedAt: new Date().toISOString()}}}).catch(e => toast(dbErr(e)));
  return true;
}

    Station: s.station, Date: dmy(m.date),
    Problem: m.meterAlerts.map(a => a.text).join("\n"),
    ...Object.fromEntries(m.meterCheck.map(c => [FUEL[c.fuel] + " (meter / recorded / difference L)", `${c.meter == null ? "-" : nL(c.meter)} / ${nL(c.recorded)} / ${c.diff == null ? "-" : nL(c.diff)}`])),
    "Cash expected / counted": `MVR ${n2(m.expected)} / ${m.cashCounted ? "MVR " + n2(m.counted) : "not counted"}`,
    Explanation: note || m.mismatchNote || "(none given)",
    "Reported by": nameOf(S.me.id) + (S.me.email ? " (" + S.me.email + ")" : ""),
    Open: location.origin + location.pathname
  };
  try {
    const r = await fetch("https://formsubmit.co/ajax/" + encodeURIComponent(owner), {method: "POST", headers: {"Content-Type": "application/json", Accept: "application/json"}, body: JSON.stringify(body)});
    const j = await r.json().catch(() => ({}));
    if (!r.ok || String(j.success) === "false") throw new Error(j.message || r.status);
    await patchDay({ownerAlert: {at: new Date().toISOString(), by: S.me.id, sig: alertSig(m)}});
    toast("Owner emailed about the mismatch"); return true;
  } catch (e) { console.error(e); toast("Couldn't email the owner (no internet?). Try Email owner now later."); return false; }
}

function custMatches(q) {
  q = q.trim().toLowerCase();
  return Object.entries(S.customers).filter(([, c]) => c && c.name && c.active !== false && (!q || c.name.toLowerCase().includes(q)))
    .sort((a, b) => { const x = a[1].name.toLowerCase(), y = b[1].name.toLowerCase(); return (q && !x.startsWith(q)) - (q && !y.startsWith(q)) || x.localeCompare(y); });

async function tableXlsx(title, sub, sections) {

    const lit = sc.cols.map((c, i) => String(c).includes(" L") ? i : -1).filter(i => i >= 0);
    xTable(ws, 5, 1, sc.cols, [...sc.rows.map(r => r.map(v => v == null ? "" : v)), ...(sc.tot ? [{kind: "total", v: sc.tot}] : [])], {litreCols: lit, badCell: (ri, ci, v) => isBadCell(sc.cols, ci, v)});
  }
  return new Blob([await wb.xlsx.writeBuffer()], {type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}

/* shared by the Slips page and "Add slip" on a transaction */
async function uploadSlip({file, amount, kind, cid, link, statusEl}) {
  const say = t => { if (statusEl) statusEl.textContent = t; };
  const id = newId(); let blob, img = {};
  say("Preparing photo…");
  try {
    blob = (await compressImage(file, 1600, .78)).blob;
    if (S.assets) { say("Uploading photo…"); try { const up = await S.assets.upload(blob, {type: "image/jpeg"}); img = {asset: up.id}; } catch {} }
    if (!img.asset) {
      let q = .62, small; for (let i = 0; i < 4; i++) { small = await compressImage(file, 1100 - i * 150, q); if (small.blob.size < 170000) break; q -= .1; }
      const dataUrl = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(small.blob); });
      await S.db.doc("slipimg/" + id).set({data: dataUrl, date: S.date}); img = {doc: true}; S.imgCache[id] = dataUrl;
    }
  } catch (er) { say(""); toast("Couldn't read that photo. Try another file."); return false; }
  const base = {date: S.date, kind, amount, customerId: cid || null, customer: cid && S.customers[cid] ? S.customers[cid].name : null, img, by: S.me.id, at: new Date().toISOString(), status: S.sample ? "checking" : "pending", ref: null};
  if (link) Object.assign(base, {entryId: link.id, entryDoc: link._doc, entryLabel: `${itemTitle(link).replace(/<[^>]*>/g, "")} · MVR ${n2(link.amount)} · ${hm(link.at)}`});
  try { await S.db.doc("slips/" + id).set(base); } catch (er) { say(""); toast(dbErr(er)); return false; }
  if (!S.sample) { say("Slip saved. Automatic checking isn't available here, so a manager will verify it."); return true; }
  say("Reading the slip… the first check on a phone takes longer while the reader loads.");
  try {
    const ai = await runSlipCheck(id, blob, amount); const ev = await evaluateSlip(id, ai, amount);
    await S.db.doc("slips/" + id).update({ai, ...ev});
    say(ev.status === "verified" ? "Verified: account number and amount match." : (STATUS[ev.status][1] + ". " + ev.note));
  } catch (er) {
    try { await S.db.doc("slips/" + id).update({status: "pending", note: sampleErr(er)}); } catch {}
    say(sampleErr(er));
  }
  return true;
}

      if (it.t === "cash") { p.pay = g("edPay").value; p.note = g("edNote").value.trim() || null; }
      if (it.t === "credit" || it.t === "collect") { const c = S.customers[g("edCust").value]; if (!c) return toast("Choose a customer"); p.customerId = g("edCust").value; p.customer = c.name; p.remark = g("edRem").value.trim() || null; }
      if (it.t === "credit") { p.po = g("edPo").value.trim() || null; p.dno = g("edDno").value.trim() || null; }
      if (it.t === "collect") { p.amount = r2(num(g("edAmt").value)); p.pay = g("edPay").value; p.ref = g("edRef").value.trim() || null; }

/* hook view-specific setup after render */
const _renderAll = renderAll;
renderAll = function () { _renderAll(); if (S.tab === "sell") { sellChips(); sellCalc(); } if (S.tab === "credit") crUpdate(true); };

/* ---------- Firebase adapter: same small API the app was written against ---------- */
function makeDb(fs) {
  const wd = sn => ({id: sn.id, exists: sn.exists, data: () => sn.data(), metadata: sn.metadata});
  const wq = q => ({docs: q.docs.map(wd), size: q.size, empty: q.empty, docChanges: () => q.docChanges(), metadata: q.metadata});
  const docRef = path => { const r = fs.doc(path); return {id: r.id, path,
    get: async () => wd(await r.get()), set: d => r.set(d), update: d => r.set(d, {merge: true}), delete: () => r.delete(),
    onSnapshot: (n, e) => r.onSnapshot(sn => n(wd(sn)), e), collection: c => colRef(path + "/" + c)}; };
  const query = q => ({where: (f, o, v) => query(q.where(f, o, v)), orderBy: (f, d) => query(q.orderBy(f, d || "asc")), limit: n => query(q.limit(n)),
    get: async () => wq(await q.get()), onSnapshot: (n, e) => q.onSnapshot(sn => n(wq(sn)), e)});
  const colRef = path => ({...query(fs.collection(path)), path, doc: id => docRef(path + "/" + (id || fs.collection(path).doc().id))});
  return {doc: docRef, collection: colRef};
}
function authErr(e) {
  const c = e && e.code || "";
  if (/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)) return "Email or password is wrong.";
  if (c.includes("email-already-in-use")) return "An account with this email already exists. Sign in instead.";
  if (c.includes("weak-password")) return "Use a password of at least 6 characters.";
  if (c.includes("invalid-email")) return "That email address doesn't look right.";
  if (c.includes("too-many-requests")) return "Too many tries. Wait a few minutes and try again.";
  if (c.includes("network")) return "No internet connection.";
  return "Something went wrong. Try again.";
}
function authMsg(t, bad) { const el = $("#authMsg"); if (el) { el.textContent = t; el.style.color = bad ? "var(--bad)" : "var(--good)"; } }
function showLogin(mode) {
  mode = mode || "in"; $("#nav").innerHTML = ""; $("#datebox").hidden = true; renderWho();
  $("#main").innerHTML = `<div class="splash stack" style="text-align:left;max-width:420px">
    <div><h1>Huvath Fuel Sales</h1><p class="muted" style="margin:4px 0 0">Sign in to record sales and see reports.</p></div>
    <div class="seg" role="group"><button type="button" data-act="authMode" data-v="in" aria-pressed="${mode === "in"}">Sign in</button><button type="button" data-act="authMode" data-v="up" aria-pressed="${mode === "up"}">Create account</button></div>
    <form class="card stack" data-form="auth" data-mode="${mode}">
      ${mode === "up" ? `<label class="f">Your name<input class="in" id="auName" autocomplete="name" required maxlength="40"></label>` : ""}
      <label class="f">Email<input class="in" id="auEmail" type="email" autocomplete="email" required></label>
      <label class="f">Password<input class="in" id="auPass" type="password" autocomplete="${mode === "up" ? "new-password" : "current-password"}" required minlength="6"></label>
      <button class="btn pri block">${mode === "up" ? "Create account" : "Sign in"}</button>
      ${mode === "in" ? `<button type="button" class="btn sm" data-act="forgot" style="align-self:flex-start">Forgot password?</button>` : `<p class="small muted" style="margin:0">After you sign up, the owner gives you a role before you can record sales.</p>`}
      <div id="authMsg" class="small" role="status"></div></form></div>`;
}
async function doAuth(f) {
  const email = $("#auEmail").value.trim(), pass = $("#auPass").value;
  try {
    if (f.dataset.mode === "up") {
      const name = $("#auName").value.trim();
      const cred = await S.auth.createUserWithEmailAndPassword(email, pass);
      await cred.user.updateProfile({displayName: name});
      S.me.name = name; S.names[cred.user.uid] = name;
      S.db && S.db.doc("staff/" + cred.user.uid).update({name, email, seen: new Date().toISOString()}).catch(() => {});
      cred.user.sendEmailVerification().catch(() => {});
      refreshLive(); if (S.role === "none") renderAll();
    } else await S.auth.signInWithEmailAndPassword(email, pass);
  } catch (er) { authMsg(authErr(er), true); }
}
function teardown() {
  [...S.unsubs, ...S.dateUnsubs].forEach(u => { try { u(); } catch {} }); S.unsubs = []; S.dateUnsubs = [];
  S.db = null; S.role = "none"; S.roles = {}; S.staff = {}; S.customers = {}; S.items = []; S.allItems = []; S.entryDocs = []; S.slips = []; S.receipts = []; S.day = {};
}
function startSession(u) {
  teardown(); S.db = makeDb(S.fs);
  const owner = String(window.HUVATH_OWNER_EMAIL || "").toLowerCase(); const email = String(u.email || "").toLowerCase();
  S.me = {id: u.uid, name: u.displayName || "", email: u.email, avatar: "", isOwner: !!owner && email === owner && u.emailVerified, ownerUnverified: !!owner && email === owner && !u.emailVerified};
  if (S.me.name) S.names[u.uid] = S.me.name;
  $("#datebox").hidden = false;
  computeRole(); subscribeGlobal(); if (S.role !== "none") subscribeDate();
  const p = {email: u.email || null, seen: new Date().toISOString()}; if (S.me.name) p.name = S.me.name;
  S.db.doc("staff/" + u.uid).update(p).catch(() => {});
  S.sample = true; S.assets = null; S.downloads = null;
  renderAll();
}
function netBanner() {
  let b = $("#netBanner");
  if (!b) { b = document.createElement("div"); b.id = "netBanner"; b.className = "banner warn"; b.style.cssText = "position:fixed;left:12px;right:12px;top:calc(68px + env(safe-area-inset-top,0px));z-index:25;text-align:center"; b.textContent = "No internet. Sales are kept on this phone and sent when the connection returns."; document.body.appendChild(b); }
  b.hidden = navigator.onLine;
}
async function boot() {
  $("#dateIn").value = S.date;
  window.addEventListener("online", netBanner); window.addEventListener("offline", netBanner); netBanner();
  const cfg = window.HUVATH_FIREBASE;
  if (!window.firebase || !cfg || !cfg.apiKey) {
    $("#nav").innerHTML = ""; $("#datebox").hidden = true;
    $("#main").innerHTML = `<div class="splash stack" style="text-align:left"><h1>Almost ready</h1><p>This website isn't connected to its database yet. Paste the Firebase settings into <b class="mono">firebase-config.js</b> (see README).</p></div>`; return;
  }
  firebase.initializeApp(cfg);
  S.fs = firebase.firestore();
  try { S.fs.settings({ignoreUndefinedProperties: true}); } catch {}
  try { await S.fs.enablePersistence({synchronizeTabs: true}); } catch {}
  S.auth = firebase.auth();
  S.auth.onAuthStateChanged(u => { if (!u) { teardown(); showLogin("in"); } else startSession(u); });
}
boot();
